<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Галерея | Егор Яковьюк</title>

    <!-- Фавикон -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Единый файл стилей -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===== ТОЛЬКО УНИКАЛЬНЫЕ СТИЛИ ДЛЯ ГАЛЕРЕИ ===== */

        /* ГАЛЕРЕЯ */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin: 30px 0 50px;
        }

        .gallery-item {
            position: relative;
            border-radius: 25px;
            overflow: hidden;
            aspect-ratio: 4/3;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease-out;
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform;
        }

        .gallery-item:hover img {
            transform: scale(1.03) translateZ(0);
        }

        .gallery-item:hover {
            border-color: #d4af37;
            box-shadow: 0 20px 30px -12px #000;
        }

        .gallery-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            color: white;
            padding: 30px 20px 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            pointer-events: none;
            z-index: 2;
            backface-visibility: hidden;
        }

        .gallery-item:hover .gallery-caption {
            transform: translateY(0);
        }

        .gallery-caption h3 {
            font-size: 1.3rem;
            margin-bottom: 5px;
            color: #d4af37;
            pointer-events: none;
        }

        .gallery-caption p {
            font-size: 0.9rem;
            color: #e5e9f0;
            pointer-events: none;
        }

        /* ЛАЙТБОКС */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 80vh;
            border: 3px solid #d4af37;
            border-radius: 20px;
            box-shadow: 0 30px 50px -20px #000;
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 3.5rem;
            color: #d4af37;
            cursor: pointer;
            background: none;
            border: none;
            transition: transform 0.3s ease, color 0.3s ease;
            z-index: 2001;
        }

        .lightbox-close:hover {
            transform: rotate(90deg) scale(1.2);
            color: #fff;
        }

        .lightbox-caption {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 1.3rem;
            font-family: 'Playfair Display', serif;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* ПАГИНАЦИЯ */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 40px 0;
        }

        .page-btn {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #b9c4d1;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .page-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
            color: #d4af37;
            transform: translateY(-2px);
        }

        .page-btn.active {
            background: #d4af37;
            border-color: #d4af37;
            color: #0c0f15;
        }

        /* АДАПТАЦИЯ */
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .gallery-item {
                border-radius: 20px;
            }

            .gallery-caption {
                padding: 20px 15px;
            }

            .gallery-caption h3 {
                font-size: 1.2rem;
            }

            .gallery-caption p {
                font-size: 0.85rem;
            }

            .pagination {
                gap: 10px;
            }

            .page-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .lightbox-close {
                top: 20px;
                right: 20px;
                font-size: 2.5rem;
            }

            .lightbox-caption {
                bottom: 20px;
                font-size: 1rem;
                padding: 0 15px;
            }
        }

        @media (min-width: 769px) and (max-width: 1200px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                EGOR YAKOVYUK
                <span>THE LEGEND</span>
            </a>

            <div class="burger" id="burger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <nav class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="bio.html" class="nav-link">Биография</a>
                <a href="wot.html" class="nav-link">World of Tanks</a>
                <a href="tarkov.html" class="nav-link">Escape from Tarkov</a>
                <a href="gallery.html" class="nav-link active">Галерея</a>
                <a href="contacts.html" class="nav-link">Контакты</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="page-header">
            <h1 class="page-title">Галерея легенды</h1>
            <p class="page-subtitle">Фотографии из карьеры Егора</p>
        </div>

        <div class="gallery-grid" id="gallery-grid"></div>

        <div class="pagination" id="pagination"></div>
    </main>

    <footer class="footer">
        <div class="legacy">
            <i class="fas fa-crown"></i> 3× Чемпион мира · Зал славы WoT · Легенда Tarkov <i class="fas fa-crown"></i>
        </div>
        <div class="footer-copyright">
            © 2025 — официальный сайт Егора Яковьюка
        </div>
    </footer>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>

    <script>
        const allPhotos = [
            { src: 'images/gallery/1.png', title: 'Первые шаги', desc: 'Начало карьеры в World of Tanks, 2016 год' },
            { src: 'images/gallery/2.png', title: 'Первый крупный турнир', desc: 'Дебют на международной арене, 2017' },
            { src: 'images/gallery/3.png', title: 'Чемпионат мира 2018', desc: 'Первый золотой кубок' },
            { src: 'images/gallery/4.png', title: 'Команда-победительница', desc: 'Легендарный состав 2018-2021' },
            { src: 'images/gallery/5.png', title: 'Чемпионат мира 2020', desc: 'Второй титул, лучший игрок турнира' },
            { src: 'images/gallery/6.png', title: 'Интервью после победы', desc: '2020 год, эмоции чемпиона' },
            { src: 'images/gallery/7.png', title: 'Тренировочный процесс', desc: 'За кулисами подготовки к турнирам' },
            { src: 'images/gallery/8.png', title: 'Чемпионат мира 2021', desc: 'Третий титул — абсолютный рекорд' },
            { src: 'images/gallery/9.png', title: 'Кубок чемпиона', desc: 'Момент награждения' },
            { src: 'images/gallery/10.png', title: 'Переход в Tarkov', desc: 'Первые шаги в новой дисциплине, 2022' },
            { src: 'images/gallery/11.png', title: 'Легендарный рейд', desc: '12 киллов, идеальная игра' },
            { src: 'images/gallery/12.png', title: 'Стрим с фанатами', desc: 'Общение с сообществом' },
            { src: 'images/gallery/13.png', title: 'Награды и трофеи', desc: 'Коллекция достижений' },
            { src: 'images/gallery/14.png', title: 'Настоящий чемпион', desc: 'Портрет легенды киберспорта' },
            { src: 'images/gallery/15.png', title: 'Сильнейший клан', desc: 'Лицо легенды на эмблеме клана' },
            { src: 'images/gallery/16.png', title: 'Тактический ход', desc: 'Решение Егора, перевернувшее исход битвы' }
        ];

        const photosPerPage = 12; // Теперь 6 фото на странице (можно изменить)
        const totalPages = Math.ceil(allPhotos.length / photosPerPage);
        let currentPage = 1;

        const galleryGrid = document.getElementById('gallery-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const pagination = document.getElementById('pagination');

        function displayPhotos(page) {
            const start = (page - 1) * photosPerPage;
            const end = start + photosPerPage;
            const photosToShow = allPhotos.slice(start, end);

            galleryGrid.innerHTML = '';

            photosToShow.forEach(photo => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.dataset.src = photo.src;

                item.innerHTML = `
                    <img src="${photo.src}" alt="${photo.title}" loading="lazy">
                    <div class="gallery-caption">
                        <h3>${photo.title}</h3>
                        <p>${photo.desc}</p>
                    </div>
                `;

                item.addEventListener('click', function() {
                    lightboxImg.src = this.dataset.src;
                    lightboxCaption.innerText = this.querySelector('.gallery-caption h3').innerText;
                    lightbox.classList.add('active');
                });

                galleryGrid.appendChild(item);
            });

            updatePagination(page);
        }

        function updatePagination(currentPage) {
            pagination.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = 'page-btn';
                if (i === currentPage) {
                    btn.classList.add('active');
                }
                btn.textContent = i;
                btn.onclick = () => changePage(i);
                pagination.appendChild(btn);
            }
        }

        function changePage(page) {
            currentPage = page;
            displayPhotos(page);
            galleryGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightbox();
            }
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        document.getElementById('lightboxClose').addEventListener('click', closeLightbox);

        const burger = document.getElementById('burger');
        const navMenu = document.getElementById('navMenu');
        const body = document.body; // ← ДОБАВИТЬ

        burger.addEventListener('click', () => {
            burger.classList.toggle('active');
            navMenu.classList.toggle('active');
            body.classList.toggle('menu-open'); // ← ДОБАВИТЬ
        });

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                burger.classList.remove('active');
                navMenu.classList.remove('active');
                body.classList.remove('menu-open'); // ← ДОБАВИТЬ
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && navMenu.classList.contains('active')) {
                burger.classList.remove('active');
                navMenu.classList.remove('active');
                body.classList.remove('menu-open'); // ← ДОБАВИТЬ
            }
        });

        displayPhotos(1);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Галерея | Егор Яковьюк</title>
    
    <!-- Фавикон -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0c0f15;
            color: #e5e9f0;
            line-height: 1.5;
            overflow-x: hidden;
            width: 100%;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* ===== ШАПКА (ИДЕАЛЬНО ОДИНАКОВАЯ ДЛЯ ВСЕХ СТРАНИЦ) ===== */
        .header {
            background: linear-gradient(180deg, #0f1219 0%, rgba(12,15,21,0.98) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff8e7, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            line-height: 1.2;
            z-index: 1001;
            white-space: nowrap;
        }

        .logo span {
            font-size: 0.65rem;
            color: #d4af37;
            display: block;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
        }

        .burger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 28px;
            height: 20px;
            cursor: pointer;
            z-index: 1001;
        }

        .burger span {
            display: block;
            width: 100%;
            height: 2.5px;
            background-color: #d4af37;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .burger.active span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .burger.active span:nth-child(2) {
            opacity: 0;
        }

        .burger.active span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        .nav-menu {
            display: flex;
            gap: 24px;
        }

        .nav-link {
            color: #b9c4d1;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 6px 0;
            position: relative;
            white-space: nowrap;
            transition: color 0.2s;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #d4af37, #f5e6b3);
            transition: width 0.3s ease;
        }

        .nav-link:hover {
            color: #fff;
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }

        .nav-link.active {
            color: #d4af37;
            font-weight: 600;
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ===== ЗАГОЛОВОК СТРАНИЦЫ ===== */
        .page-header {
            text-align: center;
            margin: 20px 0 40px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffffff, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .page-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: #a0aec0;
            max-width: 700px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* ===== ГАЛЕРЕЯ (ИСПРАВЛЕННАЯ - БЕЗ СДВИГОВ) ===== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin: 30px 0 50px;
        }

        .gallery-item {
            position: relative;
            border-radius: 25px;
            overflow: hidden;
            aspect-ratio: 4/3;
            cursor: pointer;
            /* Всегда держим место под рамку */
            border: 2px solid transparent;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            /* Стабилизируем позицию */
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease-out;
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            /* Стабилизируем изображение */
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform;
        }

        .gallery-item:hover img {
            transform: scale(1.03) translateZ(0);
        }

        .gallery-item:hover {
            border-color: #d4af37;
            box-shadow: 0 20px 30px -12px #000;
        }

        /* Подпись */
        .gallery-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            color: white;
            padding: 30px 20px 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            pointer-events: none;
            z-index: 2;
            backface-visibility: hidden;
        }

        .gallery-item:hover .gallery-caption {
            transform: translateY(0);
        }

        .gallery-caption h3 {
            font-size: 1.3rem;
            margin-bottom: 5px;
            color: #d4af37;
            pointer-events: none;
        }

        .gallery-caption p {
            font-size: 0.9rem;
            color: #e5e9f0;
            pointer-events: none;
        }

        /* ===== ЛАЙТБОКС ===== */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 80vh;
            border: 3px solid #d4af37;
            border-radius: 20px;
            box-shadow: 0 30px 50px -20px #000;
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 3.5rem;
            color: #d4af37;
            cursor: pointer;
            background: none;
            border: none;
            transition: transform 0.3s ease, color 0.3s ease;
            z-index: 2001;
        }

        .lightbox-close:hover {
            transform: rotate(90deg) scale(1.2);
            color: #fff;
        }

        .lightbox-caption {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 1.3rem;
            font-family: 'Playfair Display', serif;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* ===== ПАГИНАЦИЯ ===== */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 40px 0;
        }

        .page-btn {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #b9c4d1;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .page-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
            color: #d4af37;
            transform: translateY(-2px);
        }

        .page-btn.active {
            background: #d4af37;
            border-color: #d4af37;
            color: #0c0f15;
        }

        /* ===== ФУТЕР ===== */
        .footer {
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            padding: 25px 0;
            margin-top: 40px;
            text-align: center;
            color: #68748e;
        }

        .legacy {
            font-size: 0.75rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .legacy i {
            color: #d4af37;
            margin: 0 5px;
        }

        .footer-copyright {
            font-size: 0.7rem;
            color: #5a6578;
        }

        /* ===== АДАПТАЦИЯ ДЛЯ РАЗНЫХ ЭКРАНОВ ===== */
        @media (max-width: 1000px) {
            .nav-menu {
                gap: 16px;
            }
            
            .nav-link {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 900px) {
            .burger {
                display: flex;
            }

            .nav-menu {
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                max-width: 350px;
                height: 100vh;
                background: #0f1219;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 30px;
                transition: right 0.3s ease;
                border-left: 1px solid rgba(212, 175, 55, 0.2);
                z-index: 1000;
                padding: 20px;
            }

            .nav-menu.active {
                right: 0;
            }

            .nav-link {
                font-size: 1.2rem;
                white-space: normal;
            }
        }

        @media (max-width: 768px) {
            .header-container {
                padding: 10px 15px;
            }

            .logo {
                font-size: 1.2rem;
            }

            .logo span {
                font-size: 0.55rem;
            }

            .main {
                padding: 15px;
            }

            .page-header {
                margin: 10px 0 30px;
            }

            .page-title {
                font-size: 2.5rem;
            }

            .page-subtitle {
                font-size: 1rem;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .gallery-item {
                border-radius: 20px;
            }

            .gallery-caption {
                padding: 20px 15px;
            }

            .gallery-caption h3 {
                font-size: 1.2rem;
            }

            .gallery-caption p {
                font-size: 0.85rem;
            }

            .pagination {
                gap: 10px;
            }

            .page-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .lightbox-close {
                top: 20px;
                right: 20px;
                font-size: 2.5rem;
            }

            .lightbox-caption {
                bottom: 20px;
                font-size: 1rem;
                padding: 0 15px;
            }

            .legacy {
                font-size: 0.7rem;
                line-height: 1.4;
            }
        }

        @media (min-width: 769px) and (max-width: 1200px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1400px) {
            .nav-link {
                font-size: 1rem;
            }
            
            .page-title {
                font-size: 4rem;
            }
            
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                EGOR YAKOVYUK
                <span>THE LEGEND</span>
            </a>
            
            <div class="burger" id="burger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <nav class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="bio.html" class="nav-link">Биография</a>
                <a href="wot.html" class="nav-link">World of Tanks</a>
                <a href="tarkov.html" class="nav-link">Escape from Tarkov</a>
                <a href="gallery.html" class="nav-link active">Галерея</a>
                <a href="contacts.html" class="nav-link">Контакты</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="page-header">
            <h1 class="page-title">Галерея легенды</h1>
            <p class="page-subtitle">14 фотографий, которые рассказывают историю великой карьеры</p>
        </div>

        <div class="gallery-grid" id="gallery-grid"></div>

        <div class="pagination" id="pagination">
            <button class="page-btn active" onclick="changePage(1)">1</button>
            <button class="page-btn" onclick="changePage(2)">2</button>
        </div>

        <!-- ПОДВАЛ -->
<footer class="footer">
    <div class="legacy">
        <i class="fas fa-crown"></i> 3× Чемпион мира · Зал славы WoT · Легенда Tarkov <i class="fas fa-crown"></i>
    </div>
    <div style="margin-top: 10px; font-size: 0.75rem;">
        © 2025 — официальный сайт Егора Яковьюка
    </div>
</footer>
    </main>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>

    <script>
        const allPhotos = [
            { src: 'images/gallery/1.png', title: 'Первые шаги', desc: 'Начало карьеры в World of Tanks, 2016 год' },
            { src: 'images/gallery/2.png', title: 'Первый крупный турнир', desc: 'Дебют на международной арене, 2017' },
            { src: 'images/gallery/3.png', title: 'Чемпионат мира 2018', desc: 'Первый золотой кубок' },
            { src: 'images/gallery/4.png', title: 'Команда-победительница', desc: 'Легендарный состав 2018-2021' },
            { src: 'images/gallery/5.png', title: 'Чемпионат мира 2020', desc: 'Второй титул, лучший игрок турнира' },
            { src: 'images/gallery/6.png', title: 'Интервью после победы', desc: '2020 год, эмоции чемпиона' },
            { src: 'images/gallery/7.png', title: 'Тренировочный процесс', desc: 'За кулисами подготовки к турнирам' },
            { src: 'images/gallery/8.png', title: 'Чемпионат мира 2021', desc: 'Третий титул — абсолютный рекорд' },
            { src: 'images/gallery/9.png', title: 'Кубок чемпиона', desc: 'Момент награждения' },
            { src: 'images/gallery/10.png', title: 'Переход в Tarkov', desc: 'Первые шаги в новой дисциплине, 2022' },
            { src: 'images/gallery/11.png', title: 'Легендарный рейд', desc: '12 киллов, идеальная игра' },
            { src: 'images/gallery/12.png', title: 'Стрим с фанатами', desc: 'Общение с сообществом' },
            { src: 'images/gallery/13.png', title: 'Награды и трофеи', desc: 'Коллекция достижений' },
            { src: 'images/gallery/14.png', title: 'Настоящий чемпион', desc: 'Портрет легенды киберспорта' }
        ];

        let currentPage = 1;
        const photosPerPage = 7;

        const galleryGrid = document.getElementById('gallery-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const paginationBtns = document.querySelectorAll('.page-btn');

        function displayPhotos(page) {
            const start = (page - 1) * photosPerPage;
            const end = start + photosPerPage;
            const photosToShow = allPhotos.slice(start, end);

            galleryGrid.innerHTML = '';

            photosToShow.forEach(photo => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.dataset.src = photo.src;
                
                item.innerHTML = `
                    <img src="${photo.src}" alt="${photo.title}" loading="lazy">
                    <div class="gallery-caption">
                        <h3>${photo.title}</h3>
                        <p>${photo.desc}</p>
                    </div>
                `;
                
                item.addEventListener('click', function() {
                    lightboxImg.src = this.dataset.src;
                    lightboxCaption.innerText = this.querySelector('.gallery-caption h3').innerText;
                    lightbox.classList.add('active');
                });
                
                galleryGrid.appendChild(item);
            });

            paginationBtns.forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent == page) {
                    btn.classList.add('active');
                }
            });
        }

        function changePage(page) {
            currentPage = page;
            displayPhotos(page);
            
            // Плавный скролл к галерее
            galleryGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightbox();
            }
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        document.getElementById('lightboxClose').addEventListener('click', closeLightbox);

        // Бургер-меню
        const burger = document.getElementById('burger');
        const navMenu = document.getElementById('navMenu');
        
        burger.addEventListener('click', () => {
            burger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                burger.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });

        // Инициализация
        displayPhotos(1);
    </script>
</body>
</html>
